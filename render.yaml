services:
  - type: web
    runtime: python
    name: ledgerlock
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: LEDGERLOCK_ENV
        value: production
      - key: LEDGERLOCK_API_MODE
        value: live
      - key: USE_CLOUD_SERVICES
        value: "false"
      - key: LEDGERLOCK_CHECKPOINT_SECRET
        generateValue: true
      - key: LEDGERLOCK_ADMIN_TOKEN
        generateValue: true
