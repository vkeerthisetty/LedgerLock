services:
  floci-gcp:
    image: floci/floci-gcp:latest
    container_name: ledgerlock-floci-gcp
    ports:
      - "4588:4588"
    environment:
      FLOCI_GCP_STORAGE_MODE: hybrid
      FLOCI_GCP_HOSTNAME: floci-gcp
      FLOCI_GCP_BASE_URL: http://floci-gcp:4588
    volumes:
      - ledgerlock_floci_data:/app/data

volumes:
  ledgerlock_floci_data:
